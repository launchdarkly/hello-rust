name: Build and run
on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 9 * * *'
  push:
    branches: [ main, 'feat/**' ]
    paths-ignore:
      - '**.md' # Do not need to run CI for markdown changes.
  pull_request:
    branches: [ main, 'feat/**' ]
    paths-ignore:
      - '**.md'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed if using OIDC to get release secrets.

    steps:
      - uses: actions/checkout@v7

      - name: Get Rust version
        id: rust-version
        run: cat ./.github/variables/rust-versions.env >> $GITHUB_OUTPUT

      - name: Setup rust tooling
        env:
          RUST_TARGET: ${{ steps.rust-version.outputs.target }}
        run: rustup override set "$RUST_TARGET"

      - uses: launchdarkly/gh-actions/actions/verify-hello-app@verify-hello-app/v2
        with:
          use_server_key: true
          role_arn: ${{ vars.AWS_ROLE_ARN }}
          command: cargo run -q
